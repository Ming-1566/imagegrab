<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>图提取 ImageGrab</title>
    <link rel="stylesheet" href="gallery.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="title-wrap">
        <h1>图提取 ImageGrab</h1>
        <p id="source" class="source"></p>
      </div>
      <div class="toolbar">
        <label class="check-label">
          <input id="selectAll" type="checkbox" />
          全选
        </label>
        <button id="invertBtn" type="button">反选</button>
        <span id="selectedCount" class="count">已选 0 张</span>
        <button id="downloadBtn" type="button" class="primary">下载选中</button>
      </div>
    </header>

    <p id="hint" class="hint" hidden></p>
    <p id="filterNote" class="hint" hidden></p>
    <section id="progress" class="progress" hidden></section>
    <main id="grid" class="grid"></main>
    <p id="empty" class="empty" hidden>没有可显示的商品图。</p>

    <script src="gallery.js"></script>
  </body>
</html>
